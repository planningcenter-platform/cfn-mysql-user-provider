AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudFormation Custom MySQL User Provider SAM APP

Parameters:
  VPC:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  LambdaS3Bucket:
    Type: String
    Default: ""

Conditions:
  UsePublicBucket: !Equals
    - !Ref "LambdaS3Bucket"
    - ""

Resources:
  LambdaPolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - LambdaRole
    Properties:
      PolicyName: CFNCustomDBUserProviderPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:PutParameter
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource:
              - "*"
          # PasswordConfig: read app passwords from PCO Config's production store.
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - arn:aws:iam::499739914416:role/pco-config-ExternalConfigReadOnlyRole-*
          - Action:
              - logs:*
            Resource: arn:aws:logs:*:*:*
            Effect: Allow
      Roles:
        - !Ref "LambdaRole"

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com

  CFNDBUserProvider:
    Type: AWS::Serverless::Function
    Properties:
      Description: CloudFormation Custom:MySQLUser implementation
      CodeUri: ./src
      VpcConfig:
        SecurityGroupIds:
          - !Ref "SecurityGroup"
        SubnetIds: !Ref "Subnets"
      FunctionName: !Sub "mysql-user-provider-${VPC}"
      Handler: mysql_user_provider.handler
      MemorySize: 128
      # The 3s default doesn't cover a VPC cold start, SSM and the SQL. A timed-out
      # invocation sends no response, so CloudFormation waits an hour.
      Timeout: 60
      Role: !GetAtt "LambdaRole.Arn"
      Runtime: python3.14

Outputs:
  LambdaFunction:
    Description: "Lambda Function ARN"
    Value: !GetAtt "CFNDBUserProvider.Arn"
    Export:
      Name: !Sub "cfn-mysql-user-provider-${VPC}-function"
