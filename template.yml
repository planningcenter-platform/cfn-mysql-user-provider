AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudFormation Custom MySQL User Provider SAM APP

Parameters:
  VPC:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  LambdaS3Bucket:
    Type: String
    Default: ""

Conditions:
  UsePublicBucket: !Equals
    - !Ref "LambdaS3Bucket"
    - ""

Resources:
  LambdaPolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - LambdaRole
    Properties:
      PolicyName: CFNCustomDBUserProviderPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Admin and user passwords are read from these two trees.
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/platform/aurora/*"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/application/parameters/*"
          # Generated passwords are only ever written for the migration users.
          # Application passwords are created with `pco env` and only read here.
          - Effect: Allow
            Action:
              - ssm:PutParameter
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/application/parameters/*/migration_user*"
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
            Resource:
              - "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
          - Action:
              - logs:*
            Resource: arn:aws:logs:*:*:*
            Effect: Allow
      Roles:
        - !Ref "LambdaRole"

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com

  CFNDBUserProvider:
    Type: AWS::Serverless::Function
    Properties:
      Description: CloudFormation Custom:MySQLUser implementation
      CodeUri: ./src
      VpcConfig:
        SecurityGroupIds:
          - !Ref "SecurityGroup"
        SubnetIds: !Ref "Subnets"
      FunctionName: !Sub "mysql-user-provider-${VPC}"
      Handler: mysql_user_provider.handler
      MemorySize: 128
      # The 3s default doesn't cover a VPC cold start, two SSM calls and the SQL.
      # A timed-out invocation sends no response, so CloudFormation waits an hour.
      Timeout: 60
      Role: !GetAtt "LambdaRole.Arn"
      Runtime: python3.13

Outputs:
  LambdaFunction:
    Description: "Lambda Function ARN"
    Value: !GetAtt "CFNDBUserProvider.Arn"
    Export:
      Name: !Sub "cfn-mysql-user-provider-${VPC}-function"
